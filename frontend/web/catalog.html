<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドリルを探す — 100マス計算ジェネレーター</title>
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <h1>100マス計算ジェネレーター</h1>
      </header>

      <main class="main-content">
        <div class="grade-drills">
          <nav class="grade-nav" aria-label="ドリルのナビゲーション">
            <a class="grade-link active" href="index.html">ドリルを探す</a>
            <a class="grade-link" href="custom.html">カスタム</a>
          </nav>

          <form method="get" action="catalog.html" id="filterForm">
            <div class="drill-search">
              <label for="drillSearch">ドリルを検索</label>
              <input id="drillSearch" name="q" type="search" placeholder="分数、筆算、繰り上がり など">
            </div>
            <div class="drill-filter-bar" aria-label="ドリルの絞り込み">
              <select name="numberType" aria-label="数の種類で絞り込む">
                <option value="">すべての数の種類</option>
                <option value="integers">整数</option>
                <option value="decimals">小数</option>
                <option value="fractions">分数</option>
                <option value="mixed">混合</option>
              </select>
              <select name="grade" aria-label="学年を選択">
                <option value="">すべての学年</option>
                <option value="1">1年生</option>
                <option value="2">2年生</option>
                <option value="3">3年生</option>
                <option value="4">4年生</option>
                <option value="5">5年生</option>
                <option value="6">6年生</option>
                <option value="ungraded">無学年</option>
              </select>
              <select name="level" aria-label="レベルで絞り込む">
                <option value="">すべてのレベル</option>
                <option value="basic">基本</option>
                <option value="standard">標準</option>
                <option value="advanced">発展</option>
                <option value="exam-prep">中学受験</option>
              </select>
              <button type="submit" class="filter-reset">絞り込む</button>
            </div>
            <fieldset class="format-filter" id="formatFilter" aria-label="問題の形式" hidden>
              <legend>問題の形式</legend>
              <div id="formatFilterOptions"></div>
              <button type="submit" class="filter-reset">絞り込む</button>
            </fieldset>
          </form>
          <a class="filter-reset" href="catalog.html">絞り込みをクリア</a>

          <div id="results"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/catalog.js"></script>
  </body>
</html>
