<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100マス計算ジェネレーター</title>
  </head>
  <body>
    <div class="app-container pc-flow-page">
      <header class="app-header" id="appHeader"></header>

      <main class="main-content">
        <div class="grade-drills">
          <section class="hero-section">
            <h2 class="hero-title">毎日の計算練習をすぐにプリント</h2>
            <p class="hero-subtitle">学年を選んで、ぴったりのドリルをPDFで作成できます。</p>
          </section>

          <section class="grade-picker-section">
            <h2 class="grade-picker-heading">学年を選んでください</h2>
            <div class="grade-picker-grid">
              <a class="grade-picker-card grade-picker-card-1" href="catalog.html?grade=1"><span class="grade-picker-label">小学1年生</span></a>
              <a class="grade-picker-card grade-picker-card-2" href="catalog.html?grade=2"><span class="grade-picker-label">小学2年生</span></a>
              <a class="grade-picker-card grade-picker-card-3" href="catalog.html?grade=3"><span class="grade-picker-label">小学3年生</span></a>
              <a class="grade-picker-card grade-picker-card-4" href="catalog.html?grade=4"><span class="grade-picker-label">小学4年生</span></a>
              <a class="grade-picker-card grade-picker-card-5" href="catalog.html?grade=5"><span class="grade-picker-label">小学5年生</span></a>
              <a class="grade-picker-card grade-picker-card-6" href="catalog.html?grade=6"><span class="grade-picker-label">小学6年生</span></a>
            </div>
          </section>
        </div>
        <div id="pcMakeFlow"></div>
      </main>
    </div>
    <script type="module" src="/src/home.js"></script>
  </body>
</html>
